name: web_bridge_client
description: Unified QQ / Matrix / Telegram client for web-bridge v2.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.11.1
  flutter_secure_storage: ^11.0.0
  go_router: ^17.2.3
  matrix:
    git:
      url: https://github.com/stevessr/matrix-dart-sdk.git
      ref: 507adcbd4ee71ed8c50e1ab4afe470d38b9ceb60
  uuid: ^4.5.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
