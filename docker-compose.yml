services:
  web-bridge:
    build:
      context: .
      args:
        QQ_DEB_URL: ${QQ_DEB_URL:-}
        QQ_LINUX_CONFIG_URL: ${QQ_LINUX_CONFIG_URL:-https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/linuxConfig.js}
    restart: unless-stopped
    shm_size: 512m
    ports:
      - "${WEB_BRIDGE_PUBLISH_ADDR:-127.0.0.1}:${WEB_BRIDGE_PUBLISH_PORT:-8080}:8080"
    environment:
      WEB_BRIDGE_HOST: 0.0.0.0
      WEB_BRIDGE_PORT: 8080
      WEB_BRIDGE_CDP_HOST: 127.0.0.1
      WEB_BRIDGE_QQ_MAIN_SHIM: "1"
      WEB_BRIDGE_AUTH_TOKEN: ${WEB_BRIDGE_AUTH_TOKEN:?set WEB_BRIDGE_AUTH_TOKEN before starting docker compose}
      WEB_BRIDGE_PATCH_THROTTLE_MS: ${WEB_BRIDGE_PATCH_THROTTLE_MS:-16}
      WEB_BRIDGE_SHIM_POLL_MS: ${WEB_BRIDGE_SHIM_POLL_MS:-1000}
      WEB_BRIDGE_XVFB_SCREEN: ${WEB_BRIDGE_XVFB_SCREEN:-1440x900x24}
    volumes:
      - qq-data:/home/webbridge/.config/QQ

volumes:
  qq-data:
