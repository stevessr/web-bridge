name: apply-window-state-sync
on:
  push:
    branches: [feat/window-state-sync]
    paths:
      - '.github/workflows/apply-window-state-sync.yml'
      - 'scripts/.apply-window-state-sync.mjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair merged-source anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.apply-window-state-sync.mjs')
          text = path.read_text()
          text = text.replace("windowSizeButton?.addEventListener('click', () => {", "windowSizeButton?.addEventListener('click', (event) => {")
          path.write_text(text)
          PY
      - name: Apply implementation
        run: node scripts/.apply-window-state-sync.mjs
      - name: Validate
        run: |
          npm install --no-package-lock
          npm test
          node --check src/protocol.mjs
          node --check src/host-multi.mjs
          node --check public/input-fastpath.js
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/protocol.mjs src/host-multi.mjs public/index.html public/screens.css public/input-fastpath.js test/window-state-sync.test.mjs
          git commit -m 'feat: synchronize remote QQ window state'
          git push
