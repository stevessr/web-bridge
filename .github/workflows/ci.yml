name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --check src/cdp.mjs
      - run: node --check src/injected.mjs
      - run: node --check src/host.mjs
      - run: node --check src/qq-detect.mjs
      - run: node --check public/client.js
      - run: bash -n scripts/qq-web-bridge.sh
      - run: npm test
