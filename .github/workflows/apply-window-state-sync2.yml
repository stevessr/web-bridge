name: apply-window-state-sync-finalizer
on:
  push:
    branches: [feat/window-state-sync]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply validate and commit
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "feat: synchronize remote QQ window state" ]; then
            echo "implementation commit already present"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.apply-window-state-sync.mjs')
          text = path.read_text()
          text = text.replace("windowSizeButton?.addEventListener('click', () => {", "windowSizeButton?.addEventListener('click', (event) => {")
          path.write_text(text)
          PY
          node scripts/.apply-window-state-sync.mjs
          npm install --no-package-lock
          npm test
          node --check src/protocol.mjs
          node --check src/host-multi.mjs
          node --check public/input-fastpath.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/protocol.mjs src/host-multi.mjs public/index.html public/screens.css public/input-fastpath.js test/window-state-sync.test.mjs
          git commit -m 'feat: synchronize remote QQ window state'
          git push
