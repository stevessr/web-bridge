name: apply-window-resize

on:
  push:
    branches: ["feat/input-wheel-low-latency"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: python3 scripts/apply-window-resize.py
      - name: Validate
        run: |
          npm install --ignore-scripts
          npm test
          node --check src/protocol.mjs
          node --check src/host-multi.mjs
          node --check src/qq-main-shim.mjs
          node --check public/input-fastpath.js
      - name: Commit implementation
        run: |
          rm -f .github/workflows/apply-window-resize.yml scripts/apply-window-resize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: resize remote QQ windows from web UI"
          git push origin HEAD:feat/input-wheel-low-latency
