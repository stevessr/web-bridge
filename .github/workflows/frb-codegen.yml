name: frb-codegen

on:
  push:
    branches:
      - feat/napcat-rust-unified-v2
    paths:
      - Cargo.toml
      - crates/core/Cargo.toml
      - crates/core/src/**
      - crates/protocol/**
      - client/flutter_rust_bridge.yaml
      - client/pubspec.yaml
      - client/rust/Cargo.toml
      - client/rust/src/api.rs
      - client/rust/src/lib.rs
      - .github/workflows/frb-codegen.yml

permissions:
  contents: write

concurrency:
  group: frb-codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      generated_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install FRB codegen
        run: |
          if ! command -v flutter_rust_bridge_codegen >/dev/null 2>&1; then
            cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          fi
      - name: Resolve Flutter dependencies
        working-directory: client
        run: flutter pub get
      - name: Lock Rust dependencies
        run: cargo generate-lockfile
      - name: Generate bindings
        working-directory: client
        run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit generated bindings
        id: commit
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Bindings are already up to date."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock clippy.toml \
            crates/core/Cargo.toml crates/core/src \
            crates/protocol/Cargo.toml crates/protocol/src \
            crates/server/Cargo.toml crates/server/src \
            client/pubspec.lock client/lib/src/rust client/rust/src \
            client/rust/Cargo.toml client/pubspec.yaml client/flutter_rust_bridge.yaml
          git commit -m "chore(client): regenerate FRB bindings and lock dependencies"
          git pull --rebase origin feat/napcat-rust-unified-v2
          git push origin HEAD:feat/napcat-rust-unified-v2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  generated-ci:
    needs: generate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.generate.outputs.generated_sha }}
