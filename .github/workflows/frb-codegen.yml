name: frb-codegen

on:
  push:
    branches:
      - feat/napcat-rust-unified-v2
    paths:
      - client/flutter_rust_bridge.yaml
      - client/pubspec.yaml
      - client/rust/Cargo.toml
      - client/rust/src/api.rs
      - client/rust/src/lib.rs
      - .github/workflows/frb-codegen.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install FRB codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Resolve Flutter dependencies
        working-directory: client
        run: flutter pub get
      - name: Generate bindings
        working-directory: client
        run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify generated Rust
        run: cargo check -p web-bridge-client-core
      - name: Commit generated bindings
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Bindings are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/lib/src/rust client/rust/src client/flutter_rust_bridge.yaml
          git commit -m "chore(client): regenerate FRB bindings"
          git push
