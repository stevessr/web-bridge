[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/core",
  "crates/server",
  "client/rust",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/stevessr/web-bridge"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures-util = "0.3"
grammers-client = "0.10.0"
grammers-mtsender = "0.10.0"
grammers-session = { version = "0.10.0", default-features = false, features = ["serde"] }
matrix-sdk = { version = "0.18.0", features = ["sqlite"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
